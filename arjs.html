<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <title>WebAR - Multi-Target 8th Wall</title>

  <!-- 1. A-Frame adaptado -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  
  <!-- 2. Utilidades oficiales de 8th Wall (Carga, Errores y Gestos) -->
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/xrextras@1/dist/xrextras.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/landing-page@1/dist/landing-page.js" crossorigin="anonymous"></script>
  
  <!-- 3. Motor Core de 8th Wall (REEMPLAZA "TU_APP_KEY" SI ES REQUERIDO O MANTÉN EL BINARIO ABIERTO) -->
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js" async crossorigin="anonymous" data-preload-chunks="slam"></script>
</head>

<body>

  <!-- Escena principal utilizando los componentes nativos de 8th Wall + A-Frame -->
  <a-scene 
    xrextras-gesture-detector 
    landing-page 
    xrextras-loading 
    xrextras-runtime-error
    renderer="colorManagement:true" 
    xrweb="disableWorldTracking: true">

    <a-assets>
      <!-- Modelos 3D remotos estables de prueba (puedes cambiarlos por tus rutas locales si lo deseas) -->
      <a-asset-item id="model-cesium" src="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/CesiumMan/glTF-Binary/CesiumMan.glb"></a-asset-item>
      <a-asset-item id="model-fox" src="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/Fox/glTF-Binary/Fox.glb"></a-asset-item>
    </a-assets>

    <a-camera position="0 0 0" raycaster="objects: .cantap" cursor="fuse: false; rayOrigin: mouse;"></a-camera>

    <a-light type="directional" intensity="0.8" position="1 2 1"></a-light>
    <a-light type="ambient" intensity="1"></a-light>

    <!-- Target 1: Vinculado al nombre "target1" configurado en tus JSONs -->
    <xrextras-named-image-target name="target1">
      <a-entity gltf-model="#model-cesium" scale="0.3 0.3 0.3" rotation="90 0 0" animation-mixer></a-entity>
    </xrextras-named-image-target>

    <!-- Target 2: Vinculado al nombre "target2" configurado en tus JSONs -->
    <xrextras-named-image-target name="target2">
      <!-- Incluye rotación con un dedo nativa de xrextras -->
      <a-entity xrextras-one-finger-rotate gltf-model="#model-fox" scale="0.005 0.005 0.005" rotation="90 0 0" animation-mixer></a-entity>
    </xrextras-named-image-target>

  </a-scene>

</body>

</html>
