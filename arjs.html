<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <!-- Corregido: Meta tag moderno recomendado -->
  <meta name="mobile-web-app-capable" content="yes">
  
  <title>WebAR - Image Targets Open Source</title>

  <!-- 1. A-Frame Estándar y Estable (Reemplaza al 8frame que estaba fallando) -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  
  <!-- 2. aframe-extras desde unpkg (Evita el bloqueo de "Tracking Prevention" de jsdelivr) -->
  <script src="https://unpkg.com/aframe-extras@7.5.0/dist/aframe-extras.min.js"></script>

  <!-- 3. Motor de 8th Wall (Open Source) con precarga de SLAM -->
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js" async crossorigin="anonymous" data-preload-chunks="slam"></script>
  
  <!-- 4. Extensiones de UI de 8th Wall -->
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/xrextras@1/dist/xrextras.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/landing-page@1/dist/landing-page.js" crossorigin="anonymous"></script>

  <!-- 5. Configuración OBLIGATORIA de los Image Targets -->
  <script>
    const onxrloaded = async () => {
      try {
        // Carga los archivos .json. ¡Deben estar en la misma carpeta que este HTML!
        const [target1, target2] = await Promise.all([
          fetch('./image-targets/target1.json').then(res => {
            if (!res.ok) throw new Error('No se encontró target1.json (Verifica la ruta)');
            return res.json();
          }),
          fetch('./image-targets/target2.json').then(res => {
            if (!res.ok) throw new Error('No se encontró target2.json (Verifica la ruta)');
            return res.json();
          })
        ]);

        // Le decimos al motor open source qué imágenes debe rastrear
        XR8.XrController.configure({
          imageTargetData: [target1, target2]
        });
        console.log("✅ Image Targets configurados exitosamente.");
      } catch (error) {
        console.error("❌ Error crítico cargando los Image Targets:", error);
        alert("Error cargando los targets. Revisa la consola del navegador (F12) para más detalles.");
      }
    };

    // Ejecutar cuando el motor esté listo
    window.XR8 ? onxrloaded() : window.addEventListener('xrloaded', onxrloaded);
  </script>
</head>

<body>
  <a-scene 
    xrextras-gesture-detector 
    landing-page 
    xrextras-loading 
    xrextras-runtime-error
    renderer="colorManagement:true" 
    xrweb="disableWorldTracking: true">

    <a-assets>
      <!-- Añadido crossorigin="anonymous" para evitar problemas de CORS con GitHub -->
      <a-asset-item id="model-cesium" src="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/CesiumMan/glTF-Binary/CesiumMan.glb" crossorigin="anonymous"></a-asset-item>
      <a-asset-item id="model-fox" src="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/Fox/glTF-Binary/Fox.glb" crossorigin="anonymous"></a-asset-item>
    </a-assets>

    <a-camera position="0 0 5" raycaster="objects: .cantap" cursor="fuse: false; rayOrigin: mouse;"></a-camera>

    <a-light type="directional" intensity="0.8" position="1 2 1"></a-light>
    <a-light type="ambient" intensity="1"></a-light>

    <!-- Target 1: El 'name' debe coincidir EXACTAMENTE con el campo "name" dentro de target1.json -->
    <xrextras-named-image-target name="target1">
      <a-entity 
        gltf-model="#model-cesium" 
        scale="0.5 0.5 0.5" 
        rotation="-90 0 0" 
        animation-mixer="clip: *; loop: repeat">
      </a-entity>
    </xrextras-named-image-target>

    <!-- Target 2: El 'name' debe coincidir EXACTAMENTE con el campo "name" dentro de target2.json -->
    <xrextras-named-image-target name="target2">
      <a-entity 
        xrextras-one-finger-rotate 
        gltf-model="#model-fox" 
        scale="0.01 0.01 0.01" 
        rotation="-90 0 0" 
        animation-mixer="clip: *; loop: repeat">
      </a-entity>
    </xrextras-named-image-target>

  </a-scene>
</body>
</html>
