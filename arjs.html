<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>WebAR - 8th Wall Open Source (Sin NPM)</title>

  <!-- 1. Motor Open Source de 8th Wall (Se descarga primero) -->
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js" crossorigin="anonymous"></script>
  
  <!-- 2. A-Frame -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  
  <!-- 3. Extensiones UI de 8th Wall -->
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/xrextras@1/dist/xrextras.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/landing-page@1/dist/landing-page.js" crossorigin="anonymous"></script>

  <style>
    body { margin: 0; padding: 0; background-color: #000; }
    #scene-container { width: 100%; height: 100%; }
  </style>
</head>
<body>

  <!-- Contenedor vacío donde inyectaremos la escena una vez que XR8 esté listo -->
  <div id="scene-container"></div>

  <script>
    // Esta función crea la escena estática solo cuando el motor está garantizado
    const startAR = () => {
      console.log("XR8 Inicializado. Versión:", XR8.version());
      
      const sceneHTML = `
        <a-scene 
          xrextras-gesture-detector 
          landing-page 
          xrextras-loading 
          xrextras-runtime-error
          renderer="colorManagement:true" 
          xrweb="disableWorldTracking: true">

          <a-assets>
            <a-asset-item id="model-cesium" src="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/CesiumMan/glTF-Binary/CesiumMan.glb"></a-asset-item>
            <a-asset-item id="model-fox" src="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/Fox/glTF-Binary/Fox.glb"></a-asset-item>
          </a-assets>

          <a-camera position="0 0 0" raycaster="objects: .cantap" cursor="fuse: false; rayOrigin: mouse;"></a-camera>
          <a-light type="directional" intensity="0.8" position="1 2 1"></a-light>
          <a-light type="ambient" intensity="1"></a-light>

          <!-- Targets (asegúrate de que los nombres coincidan con los de tu JSON) -->
          <xrextras-named-image-target name="target1">
            <a-entity gltf-model="#model-cesium" scale="0.3 0.3 0.3" rotation="90 0 0" animation-mixer></a-entity>
          </xrextras-named-image-target>

          <xrextras-named-image-target name="target2">
            <a-entity xrextras-one-finger-rotate gltf-model="#model-fox" scale="0.005 0.005 0.005" rotation="90 0 0" animation-mixer></a-entity>
          </xrextras-named-image-target>

        </a-scene>
      `;
      document.getElementById('scene-container').innerHTML = sceneHTML;
    };

    // Escuchamos el evento nativo del motor que confirma que XR8 existe en la ventana
    if (window.XR8) {
      startAR();
    } else {
      window.addEventListener('xrloaded', startAR);
    }
  </script>

</body>
</html>
