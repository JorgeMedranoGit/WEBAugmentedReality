<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <title>WebAR - 8th Wall Image Targets</title>

  <!-- 1. 8frame: Versión de A-Frame 1.5.0 mantenida y optimizada por 8th Wall -->
  <script crossorigin="anonymous" src="https://cdn.8thwall.com/web/aframe/8frame-1.5.0.min.js"></script>

  <!-- 2. Motor Core de 8th Wall Open Source -->
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js" async crossorigin="anonymous" data-preload-chunks="slam"></script>

  <!-- 3. Landing page y XR Extras de 8th Wall -->
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/landing-page@1/dist/landing-page.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/xrextras@1/dist/xrextras.js" crossorigin="anonymous"></script>

  <!-- 4. aframe-extras para soportar animaciones (animation-mixer) -->
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>

  <style>
    .back-btn {
      position: fixed;
      top: 15px;
      left: 15px;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      padding: 10px 20px;
      border-radius: 20px;
      text-decoration: none;
      font-family: sans-serif;
      font-size: 14px;
      font-weight: bold;
      z-index: 99999;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.4);
    }
  </style>
</head>

<body>
  <!-- Botón Volver al menú principal -->
  <a href="index.html" class="back-btn">← Volver</a>

  <!-- Configuración sincronizada de los Image Targets antes de montar la escena -->
  <script>
    const target1Data = {
      "imagePath": "image-targets/target1_luminance.png",
      "metadata": null,
      "name": "target1",
      "type": "PLANAR",
      "properties": {
        "left": 0,
        "top": 9,
        "width": 507,
        "height": 676,
        "isRotated": true,
        "originalWidth": 507,
        "originalHeight": 694
      },
      "resources": {
        "originalImage": "target1_original.png",
        "croppedImage": "target1_cropped.png",
        "thumbnailImage": "target1_thumbnail.png",
        "luminanceImage": "target1_luminance.png"
      },
      "created": 1788556067436,
      "updated": 1788556067436
    };

    const target2Data = {
      "imagePath": "image-targets/target2_luminance.png",
      "metadata": null,
      "name": "target2",
      "type": "PLANAR",
      "properties": {
        "left": 30,
        "top": 0,
        "width": 672,
        "height": 896,
        "isRotated": true,
        "originalWidth": 732,
        "originalHeight": 896
      },
      "resources": {
        "originalImage": "target2_original.png",
        "croppedImage": "target2_cropped.png",
        "thumbnailImage": "target2_thumbnail.png",
        "luminanceImage": "target2_luminance.png"
      },
      "created": 1788556296921,
      "updated": 1788556296921
    };

    const onxrloaded = () => {
      console.log("Configurando Image Targets en XR8...");
      XR8.XrController.configure({
        imageTargetData: [target1Data, target2Data]
      });
      console.log("✅ Targets configurados correctamente en XR8.");
    };

    window.XR8 ? onxrloaded() : window.addEventListener('xrloaded', onxrloaded);
  </script>

  <!-- Escena A-Frame conectada al motor XR8 de 8th Wall -->
  <a-scene 
    xrextras-gesture-detector 
    landing-page 
    xrextras-loading 
    xrextras-runtime-error 
    renderer="colorManagement: true" 
    xrweb="disableWorldTracking: true; allowedDevices: any">

    <a-assets>
      <a-asset-item id="model-cesium" src="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/CesiumMan/glTF-Binary/CesiumMan.glb" crossorigin="anonymous"></a-asset-item>
      <a-asset-item id="model-fox" src="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/Fox/glTF-Binary/Fox.glb" crossorigin="anonymous"></a-asset-item>
    </a-assets>

    <a-camera position="0 2 5" raycaster="objects: .cantap" cursor="fuse: false; rayOrigin: mouse;"></a-camera>

    <a-light type="directional" intensity="0.8" position="1 2 1"></a-light>
    <a-light type="ambient" intensity="1"></a-light>

    <!-- Target 1: CesiumMan -->
    <xrextras-named-image-target name="target1">
      <a-entity 
        gltf-model="#model-cesium" 
        scale="0.3 0.3 0.3" 
        rotation="90 0 0" 
        animation-mixer>
      </a-entity>
    </xrextras-named-image-target>

    <!-- Target 2: Fox -->
    <xrextras-named-image-target name="target2">
      <a-entity 
        xrextras-one-finger-rotate 
        gltf-model="#model-fox" 
        scale="0.005 0.005 0.005" 
        rotation="90 0 0" 
        animation-mixer>
      </a-entity>
    </xrextras-named-image-target>

  </a-scene>
</body>
</html>
